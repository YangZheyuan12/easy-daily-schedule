name: Mobile

# 出 Android / iOS 产物。默认只在 main 上跑，也可以手动触发（Actions → Mobile → Run workflow）。
#
# ⚠️ 签名说明（重要，决定了 Android job 的两种运行形态）：
# - **配了签名 secrets**：出 **release APK**，用本地同一把钥匙签名（与本地构建一致），
#   用户覆盖安装 → 数据保留。secrets 配置见 docs/ANDROID-SIGNING.md「CI 配置」。
# - **没配 secrets**：只跑「构建验证」——debug 包编出来即证明 Android 工程没坏，
#   但**不上传产物**，并打 ::warning:: 说明原因。job 保持绿色。
#   🔴 绝不出「随机签名的发布包」：那包装不上旧版，用户只能卸载重装 →
#      IndexedDB 全丢（本项目纯本地无同步），比没有新版更糟。要发版就先配 secrets。
# - **iOS**：这个 job 的定位是**「验证 Xcode 工程能编译」**，不是出安装包。
#   原因：Apple 不允许未签名 App 装进 iPhone，签名必须要有
#     ① 一台装了 Xcode 的 Mac（用免费 Apple ID 自签，7 天有效期），或
#     ② Apple Developer（99 美元/年）的证书 + 描述文件（配成 secrets 后 CI 才能自动签名）。
#   两条路 CI 都替代不了：① 需要你的 Apple ID 交互，② 需要你先买账号。
#   所以这里改成**编模拟器版本**（模拟器不需要签名）并**不再上传产物**：
#   模拟器 .app 装不到 iPhone，唯一有用的信号是 xcodebuild 的退出码 ——
#   「Xcode 工程没坏」这件事有机器在盯就够了，多打包一个没人能用的 zip 只会制造红叉。
#
#   想在 iPhone 上真的用起来，且手上没有 Mac → 走 `pages.yml` 的网页版，
#   Safari 打开后「添加到主屏幕」，离线可用、有 App 图标。见 docs/MOBILE-APP-MIGRATION.md。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # 只把 web 产物同步进 android/，不调 cap open（CI 里没有 GUI）
      - run: npm run build
      - run: npx cap sync android

      # 签名探测 + 还原（一步完成，决定本 job 的两种形态）：
      # - secrets 齐 → 还原本地同一把钥匙，标记 present=true，后面出**签名 release 包**
      #   （与本地构建同一把钥匙 → 用户覆盖安装不丢数据）
      # - secrets 缺 → 什么都不还原，标记 present=false，只打警告；
      #   发布相关步骤全部跳过，仅保留「构建验证」（见下一个步骤）
      # 密钥内容只存在于 secrets 与 runner 内存，不落日志（printf 不打印内容）。
      - name: Restore keystore from secrets (optional)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.ANDROID_KEYSTORE_BASE64 —— 本次只验证 Android 构建，不发布包。配好 secrets 后本 job 自动产出可覆盖安装的签名包（配置见 docs/ANDROID-SIGNING.md「CI 配置」）"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/app/keystore.properties
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "keystore 已还原（内容不打印）"

      # 没配 secrets 时的构建门槛：证明 Android 工程没坏（gradlew 能编出包）。
      # 产物是 runner 随机 debug 签名，**刻意不上传**——那包装不上旧版，
      # 用户只能卸载丢数据，所以它只配当「编译通过」的信号，不配当发布物。
      - name: Build debug APK (build gate only)
        if: steps.keystore.outputs.present != 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # 签名发布包：keystore.properties 已还原本机同一把钥匙，
      # release 构建类型用它签名（见 android/app/build.gradle 的 signingConfigs）。
      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # 先打印产物树再打包：Gradle 版本的差异会让 apk 落点对不上预期，
      # 硬编码路径一旦错位就只剩一句 "No files were found"，没有现场信息没法远程排错。
      - name: List APK outputs
        if: steps.keystore.outputs.present == 'true'
        run: find android/app/build/outputs -name "*.apk" -print || true

      # 打印签名证书指纹：和手机上已装包的指纹对比，就能**提前**知道这次是
      # 「覆盖安装（数据保留）」还是「必须卸载（数据全丢）」。
      # 手机已装包的指纹：adb shell dumpsys package com.yangzheyuan.dailyschedule | grep -i signatures
      # 2026-10-16 新 keystore 的指纹：SHA256 48:AD:DE:AC:56:E1:BF:32:...:B3:E7:87
      - name: Print APK signing certificate
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk \
            | grep -iE "SHA256|SHA-256|Owner" || true

      # 把 apk 复制成想要的文件名再上传：
      # zip 内部的条目名取决于上传时的**文件路径末尾**，光改 artifact 名没用。
      # 落到 android/app/build/distributions/（该目录已在 .gitignore 里，
      # 且是 Gradle 惯例位置），cp -f 保证重跑时覆盖。
      - name: Rename APK for distribution
        if: steps.keystore.outputs.present == 'true'
        run: |
          mkdir -p android/app/build/distributions
          cp -f android/app/build/outputs/apk/release/app-release.apk \
                android/app/build/distributions/ezschedule-daily.apk
          ls -l android/app/build/distributions

      # artifact 名字 = 下载下来的 zip 名（GitHub 打包时直接加 .zip 后缀），
      # 所以这里叫什么，Actions → Artifacts 里下载的就是 `ezschedule-daily-apk.zip`；
      # zip 里的内容则是上一步改好名的 `ezschedule-daily.apk`（单文件上传 = zip 根目录下直接是它）。
      # 注意 v4 要求**同一 run 内 artifact 名唯一**，改名前先确认别的 job 没占用。
      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.present == 'true'
        with:
          name: ezschedule-daily-apk
          path: android/app/build/distributions/ezschedule-daily.apk
          retention-days: 30

      # 自动发布到 GitHub Release：每个 push 到 main 的签名包，都挂到一个固定 tag 上。
      # - tag 固定为 `latest`（同名 tag 每次 force 覆盖），配合 release 名也是 `latest`，
      #   于是你永远能用一个稳定链接下载最新 APK：
      #     https://github.com/YangZheyuan12/easy-daily-schedule/releases/latest
      # - 用 `gh release` 而非第三方 action：先 delete 旧 tag/release 再 create，
      #   避免「tag 已存在」报错；delete 用 `|| true` 容忍首次运行（还没有这个 release）。
      # - 只发布 APK 单文件，手机浏览器点开即可下载安装（仍需在手机上允许「未知来源」）。
      - name: Publish APK to GitHub Release
        if: steps.keystore.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=android/app/build/distributions/ezschedule-daily.apk
          # 先清掉可能存在的旧 latest（首次运行没有，用 || true 兜住）
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          # 建同名 release（会自动打 tag）并上传 APK
          gh release create latest "$APK" \
            --title "latest" \
            --notes "自动构建的签名 APK（versionCode 4 / versionName 1.2）。覆盖安装保留数据。" \
            --target main
          echo "下载链接: https://github.com/YangZheyuan12/easy-daily-schedule/releases/latest"

  ios:
    # Capacitor 8 要求 Xcode 26+，所以必须是 macos-26（macos-15 默认只有 Xcode 16）。
    # 如果你的组织还没开放 macos-26 runner，把这里改回 macos-15 并在 xcodebuild 前
    # 加一步 `sudo xcode-select -s /Applications/Xcode_26.app`。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      # Capacitor 8 的 iOS 工程是 **纯 SPM**：没有 .xcworkspace、没有 Podfile
      # （`ios/App/CapApp-SPM/Package.swift` 负责插件依赖）。
      # 所以这里用 -project 而不是 -workspace —— 写成 -workspace 会直接
      # 「does not exist」报错。将来若引入需要 CocoaPods 的插件，会生成 Podfile，
      # 那时才需要 pod install 并切回 -workspace。

      # 编模拟器而不是真机：模拟器构建**完全不需要签名**，所以不会再因为签名被禁用而
      # 拿不到 .app（之前 `-sdk iphoneos` + CODE_SIGNING_ALLOWED=NO 那套，xcodebuild
      # 报 BUILD SUCCEEDED 却产不出 .app，且 CI 日志要管理员权限才看得到，远程排不了错）。
      - name: Build App.app (iOS Simulator)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            build

      # 先打印产物树再打包：不同 Xcode 版本（以及将来若切回 CocoaPods）下
      # .app 的实际落点会变，硬编码路径一旦对不上就只剩一句 "No such file"，
      # 没有现场信息就没法远程排错。
      - name: List build products
        if: always()
        run: |
          echo "--- ios/build/Build/Products ---"
          find ios/build/Build/Products -maxdepth 3 2>/dev/null || echo "(Products 目录不存在)"
          echo "--- 全盘找 .app ---"
          find ios/build -maxdepth 6 -name "*.app" -type d 2>/dev/null || true

      # 🔴 刻意**不再打包上传**。
      # 两轮实践：不管编真机（CODE_SIGNING_ALLOWED=NO 时 BUILD SUCCEEDED 却没 .app）
      # 还是编模拟器（这次 find 在 ios/build 下依然什么都没找到），产物落点都对不上预期；
      # 而 GitHub 的 job 日志要仓库管理员权限（匿名 API 403），远程根本排不了错。
      # 更重要的是：**模拟器 .app 装不到 iPhone，上传它没有价值** ——
      # 真正有用的信号是 `xcodebuild` 退出码（Xcode 工程有没有坏），
      # 这一步退出码非 0 就会让整个 job 变红，已经足够了。
      #
      # 将来若要在 CI 出能装的 IPA：需要 Apple Developer 账号（99 美元/年）的
      # 证书 + 描述文件配成 secrets，再打开签名与导出步骤。
