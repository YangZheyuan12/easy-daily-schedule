name: CI

# 网页侧的质量闸门：分层红线 + 类型检查 + 单测 + 生产构建。
# 另有一个 mobile.yml 专门出 Android / iOS 产物。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 一条龙：check:layers + tsc --noEmit + vitest + vite build
      - run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
